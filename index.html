<!doctype html>
<html class="no-js" lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3efe8" />
    <meta
      name="description"
      content="佐賀の完全予約制・個室サロン care salon 結。深圧ボディケアで、休んでも抜けない疲れや慢性的なこりに寄り添います。"
    />
    <meta property="og:title" content="care salon 結｜深圧ボディケア" />
    <meta
      property="og:description"
      content="休んでも抜けない疲れを、そのままにしない。15年以上の経験をもとにした完全オーダーメイド施術。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/LP_01.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>care salon 結｜深圧ボディケア</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="lp" aria-label="care salon 結 ランディングページ">
      <section class="lp-panel" aria-label="休んでも抜けない疲れへのご提案">
        <img
          class="lp-image"
          src="assets/LP_01.webp"
          width="1122"
          height="1402"
          alt="休んでも抜けない疲れに悩む働く女性へ、深圧ケアと公式LINE予約を案内するファーストビュー"
          fetchpriority="high"
          decoding="async"
        />
        <a
          class="line-hotspot line-hotspot--hero"
          href="https://line.me/R/ti/p/@588ismqe"
          target="_blank"
          rel="noopener"
          aria-label="公式LINEで予約する（新しいタブで開きます）"
          data-line-cta="hero"
        ><span class="visually-hidden">公式LINEで予約する</span></a>
      </section>

      <section class="lp-panel" aria-label="こんなお悩みはありませんか">
        <img
          class="lp-image"
          src="assets/LP_02.webp"
          width="1122"
          height="1402"
          alt="首肩背中のこり、休んでも重い身体、頭や目の疲れ、自分のケアの後回しという悩み"
          loading="lazy"
          decoding="async"
        />
      </section>

      <section class="lp-panel" aria-label="施術の特徴とセラピスト紹介">
        <img
          class="lp-image"
          src="assets/LP_03.webp"
          width="1122"
          height="1402"
          alt="深圧ボディケア、よもぎ蒸しを含む多彩なオーダーメイド施術、頭から足先までのケアとセラピスト平河あゆみの紹介"
          loading="lazy"
          decoding="async"
        />
      </section>

      <section class="lp-panel" aria-label="料金、よくある質問、ご予約">
        <img
          class="lp-image"
          src="assets/LP_04.webp"
          width="1122"
          height="1402"
          alt="施術後の軽さと毎日の活力という価値、よくある質問、公式LINEでの予約案内"
          loading="lazy"
          decoding="async"
        />
        <a
          class="line-hotspot line-hotspot--final"
          href="https://line.me/R/ti/p/@588ismqe"
          target="_blank"
          rel="noopener"
          aria-label="公式LINEで予約・相談する（新しいタブで開きます）"
          data-line-cta="final"
        ><span class="visually-hidden">公式LINEで予約・相談する</span></a>
      </section>
    </main>
  </body>
</html>
